name: Deploy docs to GitHub Pages

# Publishes the docs/ folder (results showcase site, index.html) to GitHub Pages.
# One-time setup: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Actions source) if it isn't already, so a fresh
          # repo doesn't need the manual Settings toggle.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # First-ever deploy can flake with "Deployment failed, try again
          # later" while the Pages site provisions; give it more attempts.
          timeout: 600000
          error_count: 15
