<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
  </marker>
</defs>
<rect width="960" height="400" fill="white"/>
<text x="480.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Sign-prior layering constrains interaction matrix A</text>
<rect x="40" y="70" width="300" height="64" rx="8" fill="#e7dcf2" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="190.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L1  experimental interactions</text>
<text x="190.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Szafranski measured metabolic flows</text>
<rect x="40" y="162" width="300" height="64" rx="8" fill="#e7dcf2" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="190.0" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L2  predicted interactions</text>
<text x="190.0" y="209.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">KEGG / HMDB inferred cross-feeding</text>
<rect x="40" y="254" width="300" height="64" rx="8" fill="#e7dcf2" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="190.0" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L3  AGORA2 FBA cross-feeding (opt.)</text>
<text x="190.0" y="301.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">build_net_flow_expanded.py net flux</text>
<rect x="410" y="154" width="230" height="80" rx="8" fill="#fce3c8" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="525.0" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Signed net-flow matrix</text>
<text x="525.0" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">w_ij = |net_ij|  (confidence)</text>
<text x="525.0" y="219.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">s_ij = sign(net)_ij</text>
<rect x="700" y="148" width="230" height="92" rx="8" fill="#d3ecea" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="815.0" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Sign penalty on A</text>
<text x="815.0" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">w_ij/(2s^2) * max(0, -s_ij A_ij)^2</text>
<text x="815.0" y="219.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">constrains sign, never magnitude</text>
<path d="M 340 102 L 410 178" fill="none" stroke="#4a4a4a" stroke-width="1.8" marker-end="url(#arw)"/>
<path d="M 340 194 L 410 194" fill="none" stroke="#4a4a4a" stroke-width="1.8" marker-end="url(#arw)"/>
<path d="M 340 286 L 410 212" fill="none" stroke="#4a4a4a" stroke-width="1.8" marker-end="url(#arw)"/>
<path d="M 640 194 L 700 194" fill="none" stroke="#4a4a4a" stroke-width="1.8" marker-end="url(#arw)"/>
<text x="815" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#333" text-anchor="middle">sigma = 0.15</text>
</svg>
